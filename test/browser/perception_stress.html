<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lantern 0.9.0 Perception Stress</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080b10; color: #e8edf5; }
    #arena { width: 100%; height: 100%; display: block; }
    #result { position: fixed; top: 0.75rem; left: 0.75rem; max-width: 42rem; margin: 0; padding: 0.65rem; background: #111a; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="arena"></canvas>
  <pre id="result">Warming the 50-mob fixture…</pre>
  <script type="module">
    import { runPerceptionStressHarness } from "./perception_stress_harness.js";
    const canvas = document.getElementById("arena");
    const result = document.getElementById("result");
    try {
      const report = await runPerceptionStressHarness({ canvas, search: location.search });
      result.textContent = JSON.stringify(report, null, 2);
    } catch (error) {
      result.textContent = error?.stack ?? String(error);
    }
  </script>
</body>
</html>
